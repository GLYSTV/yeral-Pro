<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#06050f">
<title>YERAL-Pro</title>
<style>
:root{--ink:#06050f;--vio:#7b4dff;--cy:#22d3ee;--gold:#ffc247}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
background:radial-gradient(700px 480px at 12% -8%,rgba(123,77,255,.38),transparent 62%),radial-gradient(640px 440px at 100% 100%,rgba(34,211,238,.16),transparent 62%),var(--ink);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#f6f4ff;padding:16px}
form{width:100%;max-width:420px;background:linear-gradient(155deg,rgba(28,22,64,.9),rgba(12,10,30,.95));border:1px solid rgba(150,128,255,.28);border-radius:22px;padding:28px 22px;box-shadow:0 24px 60px rgba(0,0,0,.6)}
.mark{display:flex;justify-content:center;margin-bottom:10px}
.mark svg{width:64px;height:64px;filter:drop-shadow(0 0 14px rgba(123,77,255,.7))}
h1{margin:0 0 4px;text-align:center;font-size:28px;font-weight:800;letter-spacing:.5px}
h1 i{font-style:normal;color:#a287ff}
h1 b{background:linear-gradient(135deg,#ffe08a,#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent}
p{margin:0 0 18px;text-align:center;color:#a9a2cc;font-size:15px}
input[type=text],input[type=url],input[type=password]{
width:100%;height:52px;margin-bottom:14px;border:1px solid rgba(150,128,255,.3);border-radius:12px;
padding:0 14px;font-size:17px;color:#fff;background:rgba(12,10,30,.9)}
input:focus{outline:none;border-color:var(--cy);box-shadow:0 0 0 3px rgba(34,211,238,.25)}
label{display:block;margin:0 0 16px;font-size:15px;color:#d9d3f2}
button{width:100%;height:52px;border:0;border-radius:12px;
background:linear-gradient(120deg,#6a3df5,#8a5bff);color:#fff;font-size:17px;font-weight:800;letter-spacing:.5px;box-shadow:0 8px 22px rgba(106,61,245,.45)}
button:disabled{opacity:.6}
#m{margin-top:14px;text-align:center;font-size:15px;min-height:20px}
#net{font-size:12px;color:#8e88b8;margin-top:10px;text-align:center}
</style>
</head>
<body>
<form id="f" autocomplete="off">
<div class="mark"><svg viewBox="0 0 512 512" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9b6bff"/><stop offset=".5" stop-color="#6d45ff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffb02e"/></linearGradient></defs><path d="M96 104H196L256 212L316 104H416L308 300V414H204V300Z" fill="url(#g)"/><path d="M236 108V176L296 142Z" fill="url(#p)"/></svg></div>
<h1>YERAL<i>-</i><b>Pro</b></h1>
<p>Escribe tus datos y se enviarán a la TV</p>
<input name="s" type="url" placeholder="URL del servidor (http://...)" value="%%S%%"
autocapitalize="off" autocorrect="off" required>
<input name="u" type="text" placeholder="Usuario"
autocapitalize="off" autocorrect="off" required>
<input name="p" id="p" type="password" placeholder="Contraseña"
autocapitalize="off" required>
<label><input type="checkbox" id="sh"> Mostrar contraseña</label>
<button id="b">ENVIAR A LA TV</button>
<div id="m"></div>
<div id="net">🔒 Conexión local. Asegúrate de estar en tu red Wi-Fi doméstica.</div>
</form>
<script>
(function(){
  var f=document.getElementById('f');
  var m=document.getElementById('m');
  var b=document.getElementById('b');
  var sh=document.getElementById('sh');
  var p=document.getElementById('p');

  sh.onchange=function(){
    p.type=this.checked?'text':'password';
  };

  function formToBody(form){
    var fd=new FormData(form);
    var out=[];
    fd.forEach(function(v,k){
      out.push(encodeURIComponent(k)+'='+encodeURIComponent(v));
    });
    return out.join('&');
  }

  f.onsubmit=function(e){
    e.preventDefault();
    b.disabled=true;
    m.textContent='Enviando…';
    m.style.color='#f6f4ff';

    fetch('send'+location.search,{
      method:'POST',
      headers:{'Content-Type':'application/x-www-form-urlencoded'},
      body:formToBody(f)
    })
    .then(function(r){
      if(!r.ok) throw new Error('HTTP '+r.status);
      m.textContent='✔ Enviado. Mira la TV.';
      m.style.color='#34d399';
    })
    .catch(function(err){
      m.textContent='No se pudo enviar. Escanea el QR otra vez.';
      m.style.color='#ff8aa0';
      b.disabled=false;
    });
  };
})();
</script>
</body>
</html>
